    <title>Lumina Estética Avanzada & Spa | Belleza Integral y Bienestar</title>
    <meta name="description" content="Centro de estética avanzada y bienestar Lumina: depilación definitiva indolora, limpieza facial profunda, tratamientos reductores y anticelulíticos, uñas esculpidas, diseño de cejas y masajes terapéuticos." />
    
    <!-- =====================================================================
         DIRECTIVAS DE SEGURIDAD FRONTEND EN METADATOS HTML
         (X-Frame-Options y X-Content-Type-Options se gestionan como cabeceras HTTP de servidor en vite.config.js)
         ===================================================================== -->
    <!-- Política estricta de Referrer para proteger URLs de navegación -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Content Security Policy (CSP): Limita la carga de scripts, fuentes e imágenes a orígenes autorizados -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https://images.unsplash.com data: blob:; connect-src 'self' https://images.unsplash.com https://fonts.googleapis.com; frame-src 'none'; object-src 'none';" />

    <!-- Google Fonts: Playfair Display + Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..800;1,400..800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
